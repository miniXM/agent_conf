<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>第二篇样式文章</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #232323;
        background: #fffaf4;
        font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      }

      .hero {
        min-height: 320px;
        padding: 54px 22px 46px;
        background: #1f2937;
        color: #fff;
      }

      .hero-inner,
      .body {
        width: min(100%, 880px);
        margin: 0 auto;
      }

      .label {
        display: inline-block;
        color: #111827;
        background: #fbbf24;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 800;
      }

      h1 {
        width: min(100%, 680px);
        margin: 20px 0 14px;
        font-size: clamp(34px, 6vw, 58px);
        line-height: 1.08;
      }

      .hero p {
        width: min(100%, 600px);
        margin: 0;
        color: #cbd5e1;
        font-size: 17px;
        line-height: 1.8;
      }

      .body {
        padding: 34px 20px 58px;
      }

      .two-col {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 18px;
      }

      .panel {
        border: 1px solid #ead7c2;
        border-radius: 18px;
        background: #fff;
        padding: 22px;
      }

      .panel.soft {
        background: #f8fafc;
        border-color: #dbe3ed;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      p {
        margin: 0 0 14px;
        color: #4b5563;
        font-size: 16px;
        line-height: 1.85;
      }

      .quote {
        margin-top: 18px;
        border-left: 5px solid #f59e0b;
        padding: 6px 0 6px 16px;
        color: #111827;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.55;
      }

      @media (max-width: 720px) {
        .hero {
          padding-top: 36px;
        }

        .two-col {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-inner">
        <span class="label">独立样式</span>
        <h1>每篇文章都可以有自己的视觉节奏</h1>
        <p>文章不多时，不必强行做统一模板。只要卡片入口一致，详情页完全可以根据内容换排版。</p>
      </div>
    </section>

    <main class="body">
      <div class="two-col">
        <article class="panel">
          <h2>统一的部分</h2>
          <p>首页卡片统一，用户知道哪里点进去，也知道每篇文章大概是什么内容。</p>
          <p>卡片列表只维护标题、简介、封面、HTML 地址和版本号。</p>
        </article>

        <article class="panel soft">
          <h2>自由的部分</h2>
          <p>正文页由 HTML 自己决定。它可以是图文长文、步骤说明、说明书，也可以是更有设计感的单页。</p>
          <div class="quote">首页稳定，文章自由。</div>
        </article>
      </div>
    </main>
  </body>
</html>
