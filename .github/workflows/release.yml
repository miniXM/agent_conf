name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS release assets
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DEBUG: electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build macOS artifacts
        run: npm run dist:mac:dmg

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ github.ref_name }}
          path: |
            dist/**/*.dmg
            dist/**/*.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows release assets
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DEBUG: electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build Windows artifacts
        run: npm run dist:win

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ github.ref_name }}
          path: |
            dist/**/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: find release-assets -maxdepth 2 -type f | sort

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
